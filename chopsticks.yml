# PolkaPulse Chopsticks Configuration
# Forks Asset Hub (primary), HydraDX, Interlay, and Coretime Chain locally.

chains:
  # ---------------------------------------------------------------------------
  # Asset Hub — primary chain where PolkaPulse contracts are deployed
  # EVM (pallet-revive) is enabled on the Paseo Asset Hub testnet
  # ---------------------------------------------------------------------------
  assethub:
    endpoint: wss://paseo-asset-hub-rpc.polkadot.io
    port: 8000
    # Chain ID for the local EVM fork — matches polkadotHubTestnet in hardhat.config.ts
    # Paseo Asset Hub EVM chain ID: 420420417
    mock-signature-host: true
    db: ./chopsticks-db/assethub.db
    # Import these storage overrides on startup
    # Useful for pre-funding your deployer and test accounts
    import-storage:
      System.Account:
        # Deployer account — fund with 10_000 DOT (18 decimals)
        - - - "YOUR_DEPLOYER_ADDRESS"
          - data:
              free: "10000000000000000000000"
              reserved: "0"
              frozen: "0"
        # Test accounts (Hardhat signers 0–7)
        - - - "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
          - data:
              free: "10000000000000000000000"
        - - - "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
          - data:
              free: "10000000000000000000000"
        - - - "0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC"
          - data:
              free: "10000000000000000000000"
        - - - "0x90F79bf6EB2c4f870365E785982E1f101E93b906"
          - data:
              free: "10000000000000000000000"
        - - - "0x15d34AAf54267DB7D7c367839AAf71A00a2C6A65"
          - data:
              free: "10000000000000000000000"
        - - - "0x9965507D1a55bcC2695C58ba16FB37d819B0A4dc"
          - data:
              free: "10000000000000000000000"
        - - - "0x976EA74026E726554dB657fA54763abd0C3a0aa9"
          - data:
              free: "10000000000000000000000"
        - - - "0x14dC79964da2C08b23698B3D3cc7Ca32193d9955"
          - data:
              free: "10000000000000000000000"

  # ---------------------------------------------------------------------------
  # HydraDX — yield destination via XCM (parachain ID 2034)
  # ---------------------------------------------------------------------------
  hydradx:
    endpoint: wss://rococo-hydradx-rpc.hydration.dev:443
    port: 8001
    mock-signature-host: true
    db: ./chopsticks-db/hydradx.db
    import-storage:
      System.Account:
        # Fund the protocol's HydraDX sovereign account
        - - - "YOUR_HYDRADX_SOVEREIGN_ADDRESS"
          - data:
              free: "10000000000000000000000"

  # ---------------------------------------------------------------------------
  # Interlay — yield destination via XCM (parachain ID 2032)
  # ---------------------------------------------------------------------------
  interlay:
    endpoint: wss://api-testnet.interlay.io:443/parachain
    port: 8002
    mock-signature-host: true
    db: ./chopsticks-db/interlay.db
    import-storage:
      System.Account:
        # Fund the protocol's Interlay sovereign account
        - - - "YOUR_INTERLAY_SOVEREIGN_ADDRESS"
          - data:
              free: "10000000000000000000000"

  # ---------------------------------------------------------------------------
  # Coretime Chain — target for CoretimeArbitrage XCM purchases (para ID 1005)
  # ---------------------------------------------------------------------------
  coretime:
    endpoint: wss://paseo-coretime-rpc.polkadot.io
    port: 8003
    mock-signature-host: true
    db: ./chopsticks-db/coretime.db

# ---------------------------------------------------------------------------
# XCM transport config — wires the four chains together for cross-chain tests
# ---------------------------------------------------------------------------
relaychain:
  endpoint: wss://rpc.ibp.network/paseo

# Block interval in milliseconds — set to 0 for instant sealing (best for tests)
# Set to 6000 to simulate real 6-second block times
block-time: 0